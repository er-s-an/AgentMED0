services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentmed
      POSTGRES_PASSWORD: agentmed
      POSTGRES_DB: agentmed
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agentmed_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmed"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  agentmed_pg:
