name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      REQUIRE_LIVE: "false"
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: First-party skills have run.sh
        run: |
          for d in agentteams/skills/*; do
            [ "$(basename "$d")" = langfuse ] && continue
            [ -f "$d/scripts/run.sh" ] || { echo "missing $d/scripts/run.sh"; exit 1; }
          done
      - name: Secrets stay untracked
        run: |
          test ! -f .env
          git ls-files | grep -E '(^|/)\.env$' && exit 1 || true
