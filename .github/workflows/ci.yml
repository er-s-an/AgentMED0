name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      REQUIRE_LIVE: "false"
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests and skill scripts
        run: pytest -q
      - name: Skill pack contracts
        run: |
          test ! -e agentteams/skills/langfuse/scripts/run.sh
          if grep -q AgentMED agentteams/skills/langfuse/SKILL.md; then
            echo "official langfuse SKILL.md must stay vendor (no AgentMED rewrite)" >&2
            exit 1
          fi
          for d in agentteams/skills/*/; do
            name="$(basename "$d")"
            [ "$name" = langfuse ] && continue
            [ -d "$d" ] || continue
            [ -x "$d/scripts/run.sh" ] || { echo "missing executable $d/scripts/run.sh"; exit 1; }
            grep -q X-AgentMED-Principal "$d/scripts/"*.sh \
              || { echo "missing X-AgentMED-Principal in $d/scripts"; exit 1; }
          done
      - name: Secrets stay untracked
        run: |
          test ! -f .env
          git ls-files | grep -E '(^|/)\.env$' && exit 1 || true
